# Раздача собранной статики. TLS и маршрут /api — на Caddy из стека бэкенда,
# сюда приходит уже расшифрованный трафик по внутренней сети docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Имена ассетов содержат хэш содержимого — их можно кэшировать надолго.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html кэшировать нельзя: иначе после деплоя пользователь останется
    # на старой странице со ссылками на удалённые ассеты.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
